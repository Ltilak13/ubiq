name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (auto uses Conventional Commits)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: Exact version override (optional, takes precedence over bump)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update the package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_BASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          path = Path("pyproject.toml")
          # The dispatch SHA stays fixed on reruns, even after the version commit.
          base = os.environ["RELEASE_BASE_SHA"]
          base_source = subprocess.check_output(["git", "show", base + ":pyproject.toml"], text=True)
          current = tomllib.loads(base_source)["project"]["version"]
          stable = r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          if not re.fullmatch(stable, current):
              raise SystemExit("The package version must be a stable version.")
          requested = os.environ.get("RELEASE_TAG", "")
          bump = os.environ["RELEASE_BUMP"]
          if requested:
              if not re.fullmatch("v?" + stable, requested):
                  raise SystemExit("Expected a stable release version such as v1.2.3.")
              version = requested.removeprefix("v")
          else:
              if bump not in {"auto", "major", "minor", "patch"}:
                  raise SystemExit("Expected auto, major, minor, or patch.")
              if bump == "auto":
                  previous = "refs/tags/v" + current
                  subprocess.run(["git", "merge-base", "--is-ancestor", previous, base], check=True)
                  messages = subprocess.check_output(
                      ["git", "log", "--format=%B%x00", previous + ".." + base], text=True,
                  ).split("\0")
                  rank = 0
                  for message in messages:
                      message = message.strip()
                      header = re.match(r"([a-z]+)(?:\([^\n()]+\))?(!)?: .+", message, re.IGNORECASE)
                      if not header:
                          continue
                      if header[2] or re.search(r"^BREAKING(?: CHANGE|-CHANGE): .+", message, re.MULTILINE):
                          rank = 3
                      elif header[1].lower() == "feat":
                          rank = max(rank, 2)
                      elif header[1].lower() == "fix":
                          rank = max(rank, 1)
                  if not rank:
                      print("No release-worthy commits since " + previous)
                      with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                          output.write("release=false\n")
                      raise SystemExit(0)
                  bump = ("patch", "minor", "major")[rank - 1]
              parts = list(map(int, current.split(".")))
              index = ("major", "minor", "patch").index(bump)
              parts[index] += 1
              parts[index + 1:] = [0] * (2 - index)
              version = ".".join(map(str, parts))
          tag = "v" + version
          exists = subprocess.run(["git", "show-ref", "--verify", "--quiet", "refs/tags/" + tag])
          if exists.returncode not in (0, 1):
              raise SystemExit("Cannot inspect release tags.")
          if exists.returncode == 0:
              # A retry validates and publishes the original tag without moving it.
              commit = subprocess.check_output(["git", "rev-parse", tag + "^{commit}"], text=True).strip()
              subprocess.run(
                  ["git", "merge-base", "--is-ancestor", commit, "refs/remotes/origin/" + os.environ["DEFAULT_BRANCH"]],
                  check=True,
              )
              source = subprocess.check_output(["git", "show", commit + ":pyproject.toml"], text=True)
              if tomllib.loads(source)["project"]["version"] != version:
                  raise SystemExit("Existing tag has a different package version. Refusing to move it.")
              subprocess.run(["git", "checkout", "--detach", commit], check=True)
          else:
              source = path.read_text()
              current = tomllib.loads(source)["project"]["version"]
              if tuple(map(int, version.split("."))) < tuple(map(int, current.split("."))):
                  raise SystemExit("Release version must not decrease.")
              updated, count = re.subn(r'^version = "[^"]+"$', f'version = "{version}"', source, flags=re.MULTILINE)
              if count != 1 or tomllib.loads(updated)["project"]["version"] != version:
                  raise SystemExit("Expected exactly one project version field.")
              path.write_text(updated)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"release=true\ntag={tag}\nexisting={'true' if exists.returncode == 0 else 'false'}\n")
          PY
      - name: Validate the release
        if: steps.version.outputs.release == 'true'
        run: |
          python -m pip install -e ".[dev]" build twine
          python -m mypy
          ruff check src tests
          python -m pytest tests/ -q
          ubiq check
          python -m build
          python -m twine check --strict dist/*
      - name: Commit and push the version and tag
        if: steps.version.outputs.release == 'true' && steps.version.outputs.existing == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- pyproject.toml; then
            git add pyproject.toml
            git commit -m "chore(release): prepare $RELEASE_TAG"
          fi
          git tag "$RELEASE_TAG"
          # If main advances or the tag appears, neither remote ref is changed.
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG"
      - name: Publish GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" = true ]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
