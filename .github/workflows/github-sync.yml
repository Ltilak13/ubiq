name: goal-issues
on:
  push:
    branches: [main]
    paths: ["docs/goals/*-goal.md", "ubiq.yaml"]
  pull_request:
    paths: ["docs/goals/*-goal.md", "ubiq.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Read-only preview of what merging this pull request will do to issues.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Plan issue changes for every goal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FENCE: "```"
        run: |
          ubiq sync github --dry-run > "$RUNNER_TEMP/plan.json"
          { echo "${FENCE}json"; cat "$RUNNER_TEMP/plan.json"; echo "$FENCE"; } | tee -a "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: goal-issues
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      # Every run syncs every goal. The sync is idempotent, so a run that the
      # concurrency group cancels loses nothing: the next run covers it.
      - name: Create and close goal issues
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FENCE: "```"
        run: |
          status=0
          ubiq sync github --apply > "$RUNNER_TEMP/plan.json" || status=$?
          { echo "${FENCE}json"; cat "$RUNNER_TEMP/plan.json"; echo "$FENCE"; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
