name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m mypy
      - run: ruff check src tests
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-15-intel
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest tests/ -q
      # dogfood: this repo's own docs must pass their own vocabulary check
      - run: ubiq check

  minimum-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Match the runtime dependency lower bounds in pyproject.toml.
      - run: python -m pip install -e . 'pyyaml==6.0' 'jsonschema==4.18.0' 'pytest>=7.0'
      - run: python -m pip check
      - run: python -m pytest tests/ -q
      - run: ubiq check

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the baseline is the merge base, so CI needs history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      # Typed metadata coverage: a 100% floor and no regression against the
      # pull request base, or the previous main commit on push. `ubiq check`
      # in the test job stays the validation gate.
      - name: Typed metadata coverage
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # A force-push can leave the previous main commit unreachable.
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=HEAD~1
          ubiq coverage --since "$BASE" --markdown | tee -a "$GITHUB_STEP_SUMMARY"
      # Advisory: a met criterion whose cited files changed after its review needs reassessment.
      - name: Review freshness
        run: python scripts/review_freshness.py | tee -a "$GITHUB_STEP_SUMMARY"

  # Use the pull request head to show pending changes in its own runner.
  sync-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Preview what merging will change
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FENCE: "```"
        run: |
          {
            echo "Pending on merge:"
            echo "${FENCE}json"
            GITHUB_SHA="$HEAD_SHA" python -m ubiq.cli sync github --dry-run || true
            echo "$FENCE"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Compare GitHub's issues with the base revision's code and records.
  sync-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the PR merge commit includes the event's base revision
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare the base worktree
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE_TREE="$RUNNER_TEMP/ubiq-sync-base"
          git worktree add --detach "$BASE_TREE" "$BASE_SHA"
          cd "$BASE_TREE"
          if [[ -f src/ubiq/sync.py || -f scripts/goal_issues.py ]]; then
            python -m pip install -e .
          fi
      - name: Check that GitHub issues match the base revision
        shell: bash
        working-directory: ${{ runner.temp }}/ubiq-sync-base
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ! -f src/ubiq/sync.py && ! -f scripts/goal_issues.py ]]; then
            echo "skipped: the base revision does not mirror GitHub issues"
            exit 0
          fi
          if [[ -z "$GITHUB_TOKEN" ]]; then
            echo "skipped: the drift check needs GITHUB_TOKEN to read issues"
            exit 0
          fi
          export GITHUB_SHA="$BASE_SHA"
          export PYTHONPATH="$PWD/src"
          if [[ -f src/ubiq/sync.py ]]; then
            # HEAD is the base checkout. It can also have no configured mirror.
            # The derived in-review labels follow open pull requests, so this pull
            # request's own opening can change them before github-sync applies.
            extra=()
            if python -m ubiq.cli sync github --help | grep -q -- --ignore-derived; then
              extra=(--ignore-derived)
            fi
            python -m ubiq.cli sync github --check --ref HEAD "${extra[@]}"
          else
            DRIFT=$(python scripts/goal_issues.py --dry-run | jq -e 'map(select(.action != "noop"))')
            printf '%s\n' "$DRIFT"
            if [[ "$DRIFT" != "[]" ]]; then
              echo "drift: GitHub issues differ from the base revision" >&2
              exit 1
            fi
          fi

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install build twine
      # Build the wheel from the sdist to catch missing source files.
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test the installed wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/package-venv"
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install dist/*.whl 'pytest>=7.0'
          "$RUNNER_TEMP/package-venv/bin/python" -m pip check
          "$RUNNER_TEMP/package-venv/bin/python" -m pytest tests/ -q
          "$RUNNER_TEMP/package-venv/bin/ubiq" check

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check the repository with the bundled action
        uses: ./
