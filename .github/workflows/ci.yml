name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m mypy
      - run: ruff check src tests
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-15-intel
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest tests/ -q
      # dogfood: this repo's own docs must pass their own vocabulary check
      - run: ubiq check

  minimum-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Match the runtime dependency lower bounds in pyproject.toml.
      - run: python -m pip install -e . 'pyyaml==6.0' 'jsonschema==4.18.0' 'pytest>=7.0'
      - run: python -m pip check
      - run: python -m pytest tests/ -q
      - run: ubiq check

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the baseline is the merge base, so CI needs history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      # Typed metadata coverage: a 100% floor and no regression against the
      # pull request base, or the previous main commit on push. `ubiq check`
      # in the test job stays the validation gate.
      - name: Typed metadata coverage
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # A force-push can leave the previous main commit unreachable.
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=HEAD~1
          ubiq coverage --since "$BASE" --markdown | tee -a "$GITHUB_STEP_SUMMARY"

  # Read-only: compares the records with GitHub's issues and writes nothing.
  # Drift is GitHub disagreeing with the base branch, so the check reads the
  # records at the base. What this pull request changes is only previewed.
  # Without a token (some fork pull requests) the command skips and says so.
  sync-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the check reads the records at the base revision
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Preview what merging will change
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FENCE: "```"
        run: |
          # Read-only and never fails: a pending change is not drift.
          { echo "Pending on merge:"; echo "${FENCE}json"; ubiq sync github --dry-run || true; echo "$FENCE"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check that GitHub issues match the base branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: origin/${{ github.base_ref }}
        run: ubiq sync github --check --ref "$BASE"

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install build twine
      # Build the wheel from the sdist to catch missing source files.
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test the installed wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/package-venv"
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install dist/*.whl 'pytest>=7.0'
          "$RUNNER_TEMP/package-venv/bin/python" -m pip check
          "$RUNNER_TEMP/package-venv/bin/python" -m pytest tests/ -q
          "$RUNNER_TEMP/package-venv/bin/ubiq" check

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check the repository with the bundled action
        uses: ./
