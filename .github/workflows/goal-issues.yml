name: goal-issues
on:
  push:
    branches: [main]
    paths: ["docs/goals/*-goal.md"]
  pull_request:
    paths: ["docs/goals/*-goal.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Read-only preview of what merging this pull request will do to issues.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Plan issue changes for the changed goals
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FENCE: "```"
          BASE: origin/${{ github.base_ref }}
        run: |
          mapfile -t goals < <(git diff --name-only --diff-filter=d "$BASE...HEAD" -- 'docs/goals/*-goal.md')
          [ ${#goals[@]} -gt 0 ] || exit 0
          python scripts/goal_issues.py --dry-run "${goals[@]}" > "$RUNNER_TEMP/plan.json"
          { echo "${FENCE}json"; cat "$RUNNER_TEMP/plan.json"; echo "$FENCE"; } | tee -a "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: goal-issues
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      # A push syncs the goals it changed. A manual run syncs every goal.
      - name: Create and close goal issues
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FENCE: "```"
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          goals=()
          if [ "$EVENT" = push ]; then
            # A force-push can leave the previous main commit unreachable.
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null || BEFORE=HEAD~1
            mapfile -t goals < <(git diff --name-only --diff-filter=d "$BEFORE" HEAD -- 'docs/goals/*-goal.md')
            [ ${#goals[@]} -gt 0 ] || exit 0
          fi
          python scripts/goal_issues.py --apply "${goals[@]}" > "$RUNNER_TEMP/plan.json"
          { echo "${FENCE}json"; cat "$RUNNER_TEMP/plan.json"; echo "$FENCE"; } | tee -a "$GITHUB_STEP_SUMMARY"
