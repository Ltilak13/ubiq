name: inventory-example
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/inventory/package-lock.json
      - run: python3 -m pip install -e .
      - run: npm ci
        working-directory: examples/inventory
      - run: npm run check
        working-directory: examples/inventory
      - name: Check migration stability
        working-directory: examples/inventory
        run: |
          npm run generate
          test -z "$(git status --porcelain -- drizzle)"
      - run: npm run test:mutations
        working-directory: examples/inventory
