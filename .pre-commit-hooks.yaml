# Use ubiq via the pre-commit framework (https://pre-commit.com):
#
#   repos:
#     - repo: https://github.com/Ltilak13/ubiq
#       rev: v0.5.0
#       hooks:
#         - id: ubiq-check
- id: ubiq-check
  name: ubiq vocabulary and schema check
  description: Check explicit vocabulary references and configured schema contracts.
  entry: ubiq check
  language: python
  pass_filenames: false
  always_run: true
  types_or: [markdown, yaml, json]
