# ubiq self-configuration — ubiq lints its own docs (dogfood).
glossary:
  - "glossary/**/*.md"
docs:
  - "README.md"
  - "docs/**/*.md"
  - "glossary/**/*.md"
  - "skills/**/*.md"
ignore:
  - ".git/**"
# Regex patterns whose matches must resolve to a record `id:` (e.g. requirement IDs like R3, T8).
id_patterns:
  - "\\bUB-\\d+\\b"
