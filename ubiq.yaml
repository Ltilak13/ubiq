# ubiq self-configuration — ubiq lints its own docs (dogfood).
glossary:
  - glob: "docs/goals/*-goal.md"
    term_field: name
    ns: goal
  - glob: "skills/references/*.md"
    ns: part
  - "docs/policies/*.md"
  - "glossary/**/*.md"
  - glob: "skills/**/SKILL.md"
    term_field: name
    ns: skill
  - glob: ".ubiq/glossary/*.md"
    ns: skill
  - glob: "src/ubiq/features/*.md"
    term_field: name
    ns: feature
  - glob: "docs/plans/*.md"
    term_field: name
    ns: plan
  - glob: "docs/decisions/[0-9]*.md"
    term_field: name
    ns: decision
docs:
  - "README.md"
  - "docs/**/*.md"
  - "glossary/**/*.md"
  - "skills/**/*.md"
  - ".ubiq/**/*.md"
  - "src/ubiq/features/*.md"
overlays:
  - ".ubiq/overlays/*.md"
ref_fields: [uses, requires]
catalogs:
  - file: ".ubiq/catalogs/skills.json"
    items: skills
    term: basename
    cover: ["skills/**/SKILL.md"]

# Mirror goal criteria to GitHub issues (`ubiq sync github`).
sync:
  repo: Ltilak13/ubiq
  label_prefix: "priority: "
  records:
    - glob: "docs/goals/*-goal.md"
      kind: goal
    - glob: "docs/plans/*.md"
      kind: plan
    - glob: "docs/decisions/[0-9]*.md"
      kind: decision

ignore:
  - ".git/**"
  - ".venv/**"
  - ".claude/worktrees/**"
# Regex patterns whose matches must resolve to a record `id:` (e.g. requirement IDs like R3, T8).
id_patterns:
  - "\\bUB-\\d+\\b"

# Skill directories install together as siblings under one root.
edges:
  install: ["skills/*/SKILL.md", "skills/references/*.md"]

# Typed contracts for each owned asset family.
schemas:
  - schema: ".ubiq/schemas/goal-governance.json"
    files: [".ubiq/knowledge/goal-governance.yaml"]
  - schema: ".ubiq/schemas/goal.json"
    files: ["docs/goals/*-goal.md"]
    format: frontmatter
  - schema: ".ubiq/schemas/glossary-record.json"
    files: ["skills/references/*.md", "glossary/*.md", ".ubiq/glossary/*.md", "docs/policies/*.md"]
    format: frontmatter
  - schema: ".ubiq/schemas/feature.json"
    files: ["src/ubiq/features/*.md"]
    format: frontmatter
  - schema: ".ubiq/schemas/plan.json"
    files: ["docs/plans/*.md"]
    format: frontmatter
  - schema: ".ubiq/schemas/decision.json"
    files: ["docs/decisions/[0-9]*.md"]
    format: frontmatter
  - schema: ".ubiq/schemas/skill.json"
    files: ["skills/*/SKILL.md"]
    format: frontmatter
  - schema: ".ubiq/schemas/overlay.json"
    files: [".ubiq/overlays/*.md"]
    format: frontmatter
  - schema: ".ubiq/schemas/skill-catalog.json"
    files: [".ubiq/catalogs/skills.json"]
  - schema: ".ubiq/schemas/agent-interface.json"
    files: ["skills/*/agents/*.yaml"]
  - schema: ".ubiq/schemas/cursor-rule.json"
    files: [".cursor/rules/*.mdc"]
    format: frontmatter
  - schema: ".ubiq/schemas/schema-document.json"
    files: [".ubiq/schemas/*.json"]

# Every owned asset family must stay typed (`ubiq coverage --since <base>` in CI).
# Families are files that carry metadata: records, skills, overlays, catalogs,
# agent and rule files, and the schemas. Prose a skill owns (references/,
# examples/) and tool configuration (.github/, .codex/, .impeccable/,
# action.yml, .pre-commit-hooks.yaml) are outside the selection for now;
# selecting one later means adding its schema, not an exclusion.
coverage:
  files:
    - "docs/goals/*-goal.md"
    - "docs/policies/*.md"
    - ".ubiq/knowledge/*.yaml"
    - "**/SKILL.md"
    - "skills/references/*.md"
    - "skills/*/agents/*.yaml"
    - "glossary/*.md"
    - "src/ubiq/features/*.md"
    - "docs/plans/*.md"
    - "docs/decisions/[0-9]*.md"
    - ".ubiq/glossary/*.md"
    - ".ubiq/overlays/*.md"
    - ".ubiq/catalogs/*.json"
    - ".ubiq/schemas/*.json"
    - ".cursor/rules/*.mdc"
  exclude:
    - glob: "tests/fixtures/**"
      reason: "Pinned upstream skill repositories and synthetic test inputs; their metadata belongs to their sources."
  min_typed_percent: 100
  no_regression: true
