[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubiq"
version = "0.14.0"
description = "A linker for prose. Every explicit vocabulary reference resolves to exactly one defining record, or the build fails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lucas Tilak" }]
dependencies = ["pyyaml>=6.0", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261122",
    "types-jsonschema==4.26.0.20261006",
]  # Pin static analysis tools and stubs so diagnostics change deliberately.

[project.scripts]
ubiq = "ubiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ubiq = ["features/*.md"]

[tool.mypy]
files = ["src/ubiq"]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
