[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubiq"
version = "0.1.0"
description = "A linker for prose. Every term in your docs resolves to exactly one defining record, or the build fails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lucas Tilak" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ubiq = "ubiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
